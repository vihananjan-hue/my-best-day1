<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="nvsOrangeSun" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF5722" />
      <stop offset="100%" stop-color="#FF9800" />
    </linearGradient>

    <linearGradient id="nvsStudentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5722" />
      <stop offset="50%" stop-color="#E91E63" />
      <stop offset="100%" stop-color="#9C27B0" />
    </linearGradient>

    <linearGradient id="nvsWheatGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFC107" />
      <stop offset="60%" stop-color="#FFB300" />
      <stop offset="100%" stop-color="#8BC34A" />
    </linearGradient>

    <linearGradient id="nvsWheatGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8BC34A" />
      <stop offset="100%" stop-color="#4CAF50" />
    </linearGradient>

    <!-- Arc Path for Devanagari Top Text -->
    <path id="topTextArc" d="M 30,230 A 175,175 0 0,1 370,230" fill="none" />
  </defs>

  <style>
    .hindi-title {
      font-family: 'Noto Sans Devanagari', 'Mukta', 'Mangal', 'Segoe UI', system-ui, sans-serif;
      font-size: 27px;
      font-weight: 900;
      fill: #0B2B6D;
      letter-spacing: 1px;
    }
    .hindi-motto {
      font-family: 'Noto Sans Devanagari', 'Mukta', 'Mangal', 'Segoe UI', system-ui, sans-serif;
      font-size: 26px;
      font-weight: 900;
      fill: #0B2B6D;
      letter-spacing: 2px;
    }
  </style>

  <!-- Top Curved Hindi Text: नवोदय विद्यालय समिति -->
  <text class="hindi-title">
    <textPath href="#topTextArc" startOffset="50%" text-anchor="middle">नवोदय विद्यालय समिति</textPath>
  </text>

  <!-- Central Radiating Sun Waves -->
  <!-- Outer Arch -->
  <path d="M 148,155 A 58,58 0 0,1 252,155" fill="none" stroke="#FF5722" stroke-width="7" stroke-linecap="round" />
  <!-- Middle Arch -->
  <path d="M 162,165 A 42,42 0 0,1 238,165" fill="none" stroke="#FF7043" stroke-width="6" stroke-linecap="round" />
  <!-- Inner Arch -->
  <path d="M 176,175 A 26,26 0 0,1 224,175" fill="none" stroke="#FF8A65" stroke-width="5" stroke-linecap="round" />

  <!-- Radiating Central Sun Disc -->
  <circle cx="200" cy="190" r="14" fill="#FFFFFF" stroke="#FF5722" stroke-width="4" />
  <circle cx="200" cy="190" r="6" fill="#FF5722" />

  <!-- Left Student Figure -->
  <g>
    <!-- Head -->
    <circle cx="132" cy="158" r="23" fill="url(#nvsOrangeSun)" stroke="#D84315" stroke-width="2" />
    <!-- Body & Arms holding book -->
    <path d="M 100,248 C 100,205 125,195 152,205 L 176,218 C 178,222 176,238 166,242 L 140,245 C 130,246 120,250 115,255 L 100,248 Z" fill="url(#nvsStudentGrad)" />
    <!-- Horizontal arm bar -->
    <path d="M 98,206 L 168,206 C 174,206 178,214 174,222 L 158,245 C 152,252 144,256 135,256 L 98,256 C 92,256 88,252 88,246 L 88,216 C 88,210 92,206 98,206 Z" fill="url(#nvsStudentGrad)" />
  </g>

  <!-- Right Student Figure -->
  <g>
    <!-- Head -->
    <circle cx="268" cy="158" r="23" fill="url(#nvsOrangeSun)" stroke="#D84315" stroke-width="2" />
    <!-- Body & Arms holding book -->
    <path d="M 300,248 C 300,205 275,195 248,205 L 224,218 C 222,222 224,238 234,242 L 260,245 C 270,246 280,250 285,255 L 300,248 Z" fill="url(#nvsStudentGrad)" />
    <!-- Horizontal arm bar -->
    <path d="M 302,206 L 232,206 C 226,206 222,214 226,222 L 242,245 C 248,252 256,256 265,256 L 302,256 C 308,256 312,252 312,246 L 312,216 C 312,210 308,206 302,206 Z" fill="url(#nvsStudentGrad)" />
  </g>

  <!-- Center Open Book -->
  <g id="openBook">
    <!-- Book Pages Background -->
    <path d="M 200,222 Q 170,208 140,214 L 142,255 Q 170,248 200,260 Q 230,248 258,255 L 260,214 Q 230,208 200,222 Z" fill="#FDF8E4" stroke="#8E24AA" stroke-width="3" />
    <!-- Page Binding Center Line -->
    <line x1="200" y1="222" x2="200" y2="260" stroke="#8E24AA" stroke-width="3.5" />
    <!-- Page Text Lines (Stylized) -->
    <line x1="152" y1="228" x2="188" y2="225" stroke="#B39DDB" stroke-width="2" />
    <line x1="152" y1="236" x2="188" y2="233" stroke="#B39DDB" stroke-width="2" />
    <line x1="152" y1="244" x2="188" y2="241" stroke="#B39DDB" stroke-width="2" />
    <line x1="212" y1="225" x2="248" y2="228" stroke="#B39DDB" stroke-width="2" />
    <line x1="212" y1="233" x2="248" y2="236" stroke="#B39DDB" stroke-width="2" />
    <line x1="212" y1="241" x2="248" y2="244" stroke="#B39DDB" stroke-width="2" />
  </g>

  <!-- Stack of Books Below Open Book -->
  <!-- Top Closed Book -->
  <path d="M 144,260 L 256,260 L 250,274 L 150,274 Z" fill="#FFFFFF" stroke="#8E24AA" stroke-width="3" />
  <path d="M 150,274 L 250,274 L 246,284 L 154,284 Z" fill="#C2185B" stroke="#8E24AA" stroke-width="3" />
  <!-- Bottom Stacked Book -->
  <rect x="134" y="284" width="132" height="15" rx="3" fill="#FFFFFF" stroke="#8E24AA" stroke-width="3.5" />
  <rect x="130" y="299" width="140" height="15" rx="3" fill="#D81B60" stroke="#8E24AA" stroke-width="3.5" />
  <!-- Bookmark Ribbon -->
  <path d="M 194,260 L 194,295 L 200,288 L 206,295 L 206,260 Z" fill="#FFC107" />

  <!-- Left Growing Plant Sprout & Pedestal -->
  <g>
    <!-- Leaves -->
    <path d="M 76,275 C 70,265 62,260 55,264 C 55,272 63,276 76,275 Z" fill="#2E7D32" />
    <path d="M 76,268 C 76,252 82,246 88,252 C 88,260 82,268 76,268 Z" fill="#4CAF50" />
    <path d="M 76,275 C 82,265 90,260 97,264 C 97,272 89,276 76,275 Z" fill="#2E7D32" />
    <line x1="76" y1="268" x2="76" y2="280" stroke="#2E7D32" stroke-width="3.5" />
    <!-- Pedestal Bars -->
    <rect x="56" y="280" width="40" height="5" rx="2" fill="#0B2B6D" />
    <rect x="52" y="290" width="48" height="5" rx="2" fill="#0B2B6D" />
  </g>

  <!-- Right Growing Plant Sprout & Pedestal -->
  <g>
    <!-- Leaves -->
    <path d="M 324,275 C 318,265 310,260 303,264 C 303,272 311,276 324,275 Z" fill="#2E7D32" />
    <path d="M 324,268 C 324,252 330,246 336,252 C 336,260 330,268 324,268 Z" fill="#4CAF50" />
    <path d="M 324,275 C 330,265 338,260 345,264 C 345,272 337,276 324,275 Z" fill="#2E7D32" />
    <line x1="324" y1="268" x2="324" y2="280" stroke="#2E7D32" stroke-width="3.5" />
    <!-- Pedestal Bars -->
    <rect x="304" y="280" width="40" height="5" rx="2" fill="#0B2B6D" />
    <rect x="300" y="290" width="48" height="5" rx="2" fill="#0B2B6D" />
  </g>

  <!-- Middle Field & Grass Lines -->
  <g>
    <!-- Horizontal Ground Line -->
    <line x1="70" y1="324" x2="330" y2="324" stroke="#0B2B6D" stroke-width="3" />
    <!-- Grass Sprouts -->
    <path d="M 185,324 C 182,318 178,316 174,319 C 176,323 182,324 185,324 Z" fill="#388E3C" />
    <path d="M 185,324 C 185,315 188,312 192,315 C 191,320 187,324 185,324 Z" fill="#4CAF50" />
    <path d="M 215,324 C 212,318 208,316 204,319 C 206,323 212,324 215,324 Z" fill="#388E3C" />
    <path d="M 215,324 C 215,315 218,312 222,315 C 221,320 217,324 215,324 Z" fill="#4CAF50" />
    <!-- Lower Ground Line -->
    <line x1="90" y1="338" x2="310" y2="338" stroke="#0B2B6D" stroke-width="3" />
    <!-- Lower Basin / Bowl (Green Fertile Soil) -->
    <path d="M 130,344 Q 200,378 270,344 Z" fill="#43A047" stroke="#2E7D32" stroke-width="2" />
    <!-- Center Plant in Basin -->
    <path d="M 200,340 C 196,330 190,327 185,331 C 187,336 195,340 200,340 Z" fill="#81C784" />
    <path d="M 200,340 C 200,328 204,324 208,328 C 207,333 203,340 200,340 Z" fill="#A5D6A7" />
  </g>

  <!-- Left Wheat Sheaf / Wreath (Gold at top transitioning to green at bottom) -->
  <g>
    <!-- Top Gold Ears -->
    <path d="M 40,210 C 26,200 20,185 24,178 C 32,178 38,194 40,210 Z" fill="#FFC107" stroke="#FFA000" stroke-width="1.5" />
    <path d="M 45,230 C 25,225 18,210 22,204 C 30,204 38,216 45,230 Z" fill="#FFC107" stroke="#FFA000" stroke-width="1.5" />
    <path d="M 48,255 C 26,252 18,238 23,230 C 31,230 40,242 48,255 Z" fill="#FFCA28" stroke="#FFB300" stroke-width="1.5" />
    <path d="M 50,280 C 28,280 20,266 26,258 C 34,258 42,269 50,280 Z" fill="#FFD54F" stroke="#FFB300" stroke-width="1.5" />
    <!-- Middle Transition Ears -->
    <path d="M 52,305 C 32,308 24,295 30,286 C 38,286 46,295 52,305 Z" fill="#D4E157" stroke="#AFB42B" stroke-width="1.5" />
    <path d="M 55,330 C 35,335 28,324 35,315 C 43,315 50,322 55,330 Z" fill="#9CCC65" stroke="#7CB342" stroke-width="1.5" />
    <!-- Bottom Green Leaves & Wreath Arch -->
    <path d="M 60,358 C 42,366 36,356 42,345 C 50,345 56,350 60,358 Z" fill="#7CB342" stroke="#558B2F" stroke-width="1.5" />
    <path d="M 70,385 C 52,396 46,386 52,375 C 60,375 66,378 70,385 Z" fill="#4CAF50" stroke="#2E7D32" stroke-width="1.5" />
    <path d="M 85,410 C 68,422 62,412 68,402 C 76,402 82,404 85,410 Z" fill="#43A047" stroke="#2E7D32" stroke-width="1.5" />
    <path d="M 105,430 C 88,442 84,432 90,422 C 98,422 103,425 105,430 Z" fill="#388E3C" stroke="#1B5E20" stroke-width="1.5" />
    <path d="M 130,446 C 114,458 110,448 116,438 C 124,438 128,441 130,446 Z" fill="#2E7D32" stroke="#1B5E20" stroke-width="1.5" />
    <!-- Leaf Sprigs on Left Rim -->
    <path d="M 50,320 Q 30,370 80,420" fill="none" stroke="#2E7D32" stroke-width="4.5" stroke-linecap="round" />
  </g>

  <!-- Right Wheat Sheaf / Wreath (Symmetric) -->
  <g>
    <!-- Top Gold Ears -->
    <path d="M 360,210 C 374,200 380,185 376,178 C 368,178 362,194 360,210 Z" fill="#FFC107" stroke="#FFA000" stroke-width="1.5" />
    <path d="M 355,230 C 375,225 382,210 378,204 C 370,204 362,216 355,230 Z" fill="#FFC107" stroke="#FFA000" stroke-width="1.5" />
    <path d="M 352,255 C 374,252 382,238 377,230 C 369,230 360,242 352,255 Z" fill="#FFCA28" stroke="#FFB300" stroke-width="1.5" />
    <path d="M 350,280 C 372,280 380,266 374,258 C 366,258 358,269 350,280 Z" fill="#FFD54F" stroke="#FFB300" stroke-width="1.5" />
    <!-- Middle Transition Ears -->
    <path d="M 348,305 C 368,308 376,295 370,286 C 362,286 354,295 348,305 Z" fill="#D4E157" stroke="#AFB42B" stroke-width="1.5" />
    <path d="M 345,330 C 365,335 372,324 365,315 C 357,315 350,322 345,330 Z" fill="#9CCC65" stroke="#7CB342" stroke-width="1.5" />
    <!-- Bottom Green Leaves & Wreath Arch -->
    <path d="M 340,358 C 358,366 364,356 358,345 C 350,345 344,350 340,358 Z" fill="#7CB342" stroke="#558B2F" stroke-width="1.5" />
    <path d="M 330,385 C 348,396 354,386 348,375 C 340,375 334,378 330,385 Z" fill="#4CAF50" stroke="#2E7D32" stroke-width="1.5" />
    <path d="M 315,410 C 332,422 338,412 332,402 C 324,402 318,404 315,410 Z" fill="#43A047" stroke="#2E7D32" stroke-width="1.5" />
    <path d="M 295,430 C 312,442 316,432 310,422 C 302,422 297,425 295,430 Z" fill="#388E3C" stroke="#1B5E20" stroke-width="1.5" />
    <path d="M 270,446 C 286,458 290,448 284,438 C 276,438 272,441 270,446 Z" fill="#2E7D32" stroke="#1B5E20" stroke-width="1.5" />
    <!-- Leaf Sprigs on Right Rim -->
    <path d="M 350,320 Q 370,370 320,420" fill="none" stroke="#2E7D32" stroke-width="4.5" stroke-linecap="round" />
  </g>

  <!-- Bottom Ribbon with Motto: प्रज्ञानं ब्रह्म -->
  <g>
    <!-- Ribbon Shadow / Fold Ends -->
    <path d="M 68,460 L 52,482 L 80,488 L 84,472 Z" fill="#0A2566" />
    <path d="M 332,460 L 348,482 L 320,488 L 316,472 Z" fill="#0A2566" />
    <!-- Ribbon Body -->
    <path d="M 75,455 Q 200,448 325,455 L 320,495 Q 200,488 80,495 Z" fill="#FFFFFF" stroke="#0B2B6D" stroke-width="3" />
    <!-- Motto Text -->
    <text x="200" y="482" text-anchor="middle" class="hindi-motto">प्रज्ञानं ब्रह्म</text>
  </g>
</svg>
